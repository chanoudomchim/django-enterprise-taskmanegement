{% extends "base.html" %}

{% block title %}{{ title }} | {{ current_organization.name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="d-flex align-items-center gap-2 mb-3">
            <a href="{% url 'approval_request_list' %}" class="text-decoration-none text-muted small">
                <i class="bi bi-arrow-left me-1"></i> Back to Approvals
            </a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom">
                <h5 class="fw-bold mb-0">{{ title }}</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Approval Workflow <span class="text-danger">*</span></label>
                        {{ form.workflow }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Request Title <span class="text-danger">*</span></label>
                        {{ form.title }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Description / Justification</label>
                        {{ form.description }}
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Linked Project (Optional)</label>
                            {{ form.project }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Linked Task (Optional)</label>
                            {{ form.task }}
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'approval_request_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary fw-semibold px-4">Submit Request</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
